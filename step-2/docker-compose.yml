services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://familytask:familytask@db:5432/familytask
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: familytask
      POSTGRES_PASSWORD: familytask
      POSTGRES_DB: familytask
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
