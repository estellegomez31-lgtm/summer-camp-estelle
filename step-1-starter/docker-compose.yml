services:
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://familytask:familytask@db:5432/familytask
      OLLAMA_URL: http://ai:11434
      OLLAMA_MODEL: qwen2.5:3b
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: familytask
      POSTGRES_PASSWORD: familytask
      POSTGRES_DB: familytask
    volumes:
      - pgdata:/var/lib/postgresql/data

# ---------------------------------------------------------------------------
# ÉTAPE 2 DE L'INSTALLATION (à faire APRÈS que les 3 conteneurs ci-dessus
# tournent). Ollama est l'IA qui vivra dans l'app : son image est lourde, on la
# télécharge séparément pour ne pas bloquer le premier lancement.
#
# Pour l'activer : retire le "#" devant les 4 lignes du service "ai" et devant
# la ligne "ollama:" en bas, puis relance : docker compose up
# ---------------------------------------------------------------------------
  ai:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
