databases:
  - name: familytask-db

services:
  - type: web
    name: familytask-back
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

  - type: static
    name: familytask-front
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://familytask-back.onrender.com
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
