databases:
  - name: familytask-db
    plan: free

services:
  - type: web
    name: familytask-api
    runtime: python
    rootDir: step-6/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

  - type: web
    name: familytask-front
    runtime: static
    rootDir: step-6/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: familytask-api
          property: host
